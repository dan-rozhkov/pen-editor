<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:390px;height:844px;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1c1b2e;-webkit-font-smoothing:antialiased}.sb{display:flex;justify-content:space-between;padding:16px 28px 0;font-size:15px;font-weight:600}
body{background:#f4f1fb}
.hd{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center}
.hd small{font-size:14px;color:#6b6985}.hd h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff9a6c,#ff5e8a);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.card{margin:20px 24px 0;border-radius:26px;padding:22px;background:linear-gradient(150deg,#7c4dff,#4d6bff);color:#fff;display:flex;align-items:center;gap:20px}
.pr{width:92px;height:92px;border-radius:50%;background:conic-gradient(#fff 0 66%,rgba(255,255,255,.28) 66% 100%);display:flex;align-items:center;justify-content:center}
.pr b{width:72px;height:72px;border-radius:50%;background:#6a58ff;display:flex;align-items:center;justify-content:center;font-size:22px}
.card h2{font-size:22px;line-height:1.2}.card p{margin-top:6px;font-size:14px;opacity:.85}
.days{display:flex;justify-content:space-between;padding:20px 24px 0}
.d{width:42px;text-align:center;font-size:12px;color:#6b6985;font-weight:600}.d span{display:flex;margin-top:6px;height:42px;border-radius:14px;background:#fff;align-items:center;justify-content:center;font-size:16px;color:#1c1b2e;font-weight:700}
.d.on span{background:#1c1b2e;color:#fff}
.sec{padding:22px 24px 10px;font-weight:800;font-size:18px}
.row{margin:0 24px 12px;background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(40,30,90,.05)}
.dot{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.row div.t{flex:1;font-weight:700;font-size:16px}.row div.t small{display:block;font-weight:500;font-size:13px;color:#6b6985;margin-top:3px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid #d5cfe8}
.ck.ok{background:#27b36a;border-color:#27b36a;display:flex;align-items:center;justify-content:center}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;display:flex;justify-content:space-around;padding-top:14px;font-size:12px;font-weight:600;color:#9a96b3}
.tab i{display:block;width:26px;height:26px;border-radius:9px;background:#e3dff0;margin:0 auto 4px}.tab .a{color:#7c4dff}.tab .a i{background:#7c4dff}
</style></head><body>

<div class="tab"><div class="a"><i></i>Today</div><div><i></i>Habits</div><div><i></i>Stats</div><div><i></i>Profile</div></div>
</body></html>
