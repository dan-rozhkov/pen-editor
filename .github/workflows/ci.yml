name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, duplication gates and the production build. Unit tests run in the
  # sharded `unit` job below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # jscpd duplication gate: fails if duplicated lines in production code
      # (src/ minus __tests__ and vendor) exceed the threshold in .jscpd.json.
      - run: npm run check:dup
      # Ratchet on duplicated lines in unit + e2e tests: may never exceed
      # test-dup-baseline.json (see CLAUDE.md → Testing).
      - run: npm run check:dup:tests
      - run: npm run build

  # Unit tests run in 2 shards: the single coverage step took ~8 min and was
  # the CI critical path. 2 shards bring it under the e2e job's ~7.5 min; a 3rd
  # would not shorten wall time because e2e bounds it.
  unit:
    name: unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs this shard with coverage and writes a blob report. Thresholds are
      # NOT enforced here (a shard sees half the tests); the `coverage` job
      # does that on the merged report.
      - run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/2
      # Surfaces any test that only passed on retry (see vitest.config.ts's
      # `retry`/`reporters`) as a step-summary table. Each shard writes its
      # own summary, which is how flaky tests are collected from all shards.
      # Always runs, even if the tests above failed, and no-ops quietly if
      # nothing was flaky.
      - if: always()
        run: npm run test:flaky-summary
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest-reports/*
          # upload-artifact v4+ skips hidden paths such as .vitest-reports.
          include-hidden-files: true
          retention-days: 1

  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: .vitest-reports
      # Merges the shards' blob reports into one run AND enforces the
      # non-regression coverage thresholds in vitest.config.ts (fails if
      # coverage drops). This is the only place the thresholds are enforced.
      - run: npm run test:coverage:merge

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Playwright starts the Vite dev server itself (webServer in
      # playwright.config.ts); /api/chat is stubbed, no backend needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      # HTML report (with the trace viewer for every retry attempt) for
      # flaky/failed runs, kept short since this is a build artifact, not a
      # record — always() so a failed run's report is captured too.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Cross-repo contracts: checks out the sibling backend and desktop repos so
  # the contract tests actually run instead of self-skipping.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: pen-editor
      - uses: actions/checkout@v5
        with:
          repository: dan-rozhkov/pen-editor-backend
          path: pen-editor-backend
      - uses: actions/checkout@v5
        with:
          repository: dan-rozhkov/pen-editor-desktop
          path: pen-editor-desktop
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pen-editor/package-lock.json
      - run: npm ci
        working-directory: pen-editor
      # The contract test imports ../pen-editor-backend/src/ai/tools.ts, which
      # needs the backend's node_modules (ai, zod) to resolve.
      - run: npm ci
        working-directory: pen-editor-backend
      # The desktop menu contract needs no npm ci over there: menu.ts imports
      # only a type from electron, so it loads with nothing installed.
      # modelContract belongs here and NOWHERE else: it self-skips
      # (describe.runIf) when ../pen-editor-backend is absent, which is every
      # run of the ordinary `unit (N/2)` shards, so leaving it out of this list meant
      # picker/DEFAULT_MODELS drift shipped green in both repos.
      - run: npx vitest run src/lib/__tests__/toolContract.test.ts src/lib/plugins/__tests__/pluginAllowlistContract.test.ts src/lib/__tests__/desktopMenuContract.test.ts src/lib/__tests__/modelContract.test.ts src/lib/__tests__/desktopTokensContract.test.ts src/lib/__tests__/desktopSettingsContract.test.ts src/components/icons/__tests__/desktopIconsContract.test.tsx
        working-directory: pen-editor
        env:
          CONTRACT_REQUIRE_BACKEND: "1"
          CONTRACT_REQUIRE_DESKTOP: "1"
